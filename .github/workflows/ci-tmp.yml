# 每次推到 main、每个 PR：核心测试、书页测试、词表、Android 和 Apple 编译。红了不合。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  title:
    name: PR 标题合规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-commit-msg.sh --title "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}

  core:
    name: 核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --workspace --locked
        working-directory: core

  reader:
    name: 书页测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reader/package.json
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reader-test-results
          path: reader/test-results
          retention-days: 7

  l10n:
    name: 英文词表不缺
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apple 词表
        run: |
          out=$(python3 scripts/l10n-apple.py)
          [ "$out" = "{}" ] || { echo "Apple 词表缺英文："; echo "$out"; exit 1; }
      - name: Android 词表
        run: |
          out=$(python3 scripts/l10n-android-missing.py)
          [ "$out" = "{}" ] || { echo "Android 缺英文（填进 extra-en.json）："; echo "$out"; exit 1; }

  android:
    name: Android 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 ndk;30.0.16248370
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: cargo install cargo-ndk --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reader/package.json
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - name: 书页
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: reader
      - name: 核心
        run: android/build-core.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: yuyue-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  apple:
    name: Apple 编译
    # 要能编 macOS 14 / iOS 17 以上、带 Icon Composer 图标的 Xcode；runner 的 Xcode 跟不上本机时改这里。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reader/package.json
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - name: 书页
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: reader
      - name: 核心
        run: apple/build-core.sh
      - name: 工程
        run: brew install xcodegen && xcodegen
        working-directory: apple
      - name: Mac
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Yuyue.xcodeproj -scheme Yuyue -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > /tmp/xcodebuild-mac.log 2>&1 || {
              grep -E '(: error:|fatal error:|\*\* BUILD FAILED \*\*)' /tmp/xcodebuild-mac.log | head -80 || true
              tail -40 /tmp/xcodebuild-mac.log
              exit 1
            }
          tail -10 /tmp/xcodebuild-mac.log
      - name: iPhone
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Yuyue.xcodeproj -scheme Yuyue -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd-ios \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xcodebuild-ios.log 2>&1 || {
              grep -E '(: error:|fatal error:|\*\* BUILD FAILED \*\*)' /tmp/xcodebuild-ios.log | head -80 || true
              tail -40 /tmp/xcodebuild-ios.log
              exit 1
            }
          tail -10 /tmp/xcodebuild-ios.log

  windows:
    name: Windows 编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows
      - name: 缓存 uniffi-bindgen-cs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: ${{ runner.os }}-uniffi-bindgen-cs-v0.12.0+v0.32.0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reader/package.json
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 书页与 Rust 核心
        shell: pwsh
        run: ./windows/build-core.ps1 -Arch x64 -SkipTokens
      - name: 英文词典合并与 XAML 覆盖审计
        shell: pwsh
        run: node windows/build-l10n.mjs --audit
      - name: WinUI 3 编译
        shell: pwsh
        run: dotnet build windows/Yuyue/Yuyue.csproj -c Release -p:Platform=x64 --warnaserror:false
      - name: Windows 单元测试
        shell: pwsh
        run: dotnet test windows/Yuyue.Tests/Yuyue.Tests.csproj -c Release -p:Platform=x64 --verbosity minimal
